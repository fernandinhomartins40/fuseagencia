# nginx do HOST (VPS 72.60.10.112) para fuseagencia.com.br e www.fuseagencia.com.br.
# Instalado UMA vez pelo deploy/setup-host.sh (workflow manual "Configurar nginx do host e HTTPS").
# Depois, o certbot (--nginx) acrescenta os blocos HTTPS e o redirecionamento HTTP -> HTTPS.
# O compose da FUSE Agência escuta só em 127.0.0.1:3700.

# www -> sem www (endereço canônico).
server {
  listen 80;
  listen [::]:80;
  server_name www.fuseagencia.com.br;
  return 301 https://fuseagencia.com.br$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name fuseagencia.com.br;

  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:3700;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }
}
